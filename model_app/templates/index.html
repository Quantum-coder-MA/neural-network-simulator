<!DOCTYPE html>
<html>
<head>
    <title>Test Simulation IA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        #logs { background: #f0f0f0; height: 300px; overflow-y: scroll; padding: 10px; border: 1px solid #999; font-family: monospace; }
        .btn { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h1>Console de Test Simulation</h1>

    <div class="box">
        <h3>1. Simulation Entraînement</h3>
        <button class="btn" onclick="startTraining()">Lancer l'Entraînement</button>
        <p>Status: <span id="train-status">En attente...</span></p>
        <p>Loss: <span id="loss-display">-</span> | Accuracy: <span id="acc-display">-</span></p>
    </div>

    <div class="box">
        <h3>2. Simulation Prédiction</h3>
        <input type="file" id="imageInput" accept="image/*">
        <button class="btn" onclick="predictImage()">Prédire l'image</button>
        <p>Probabilité : <span id="pred-result">-</span></p>
    </div>

    <h3>Logs (Données reçues du Python)</h3>
    <div id="logs"></div>

    <script>
        var socket = io();

        // --- FONCTIONS LOGS ---
        function log(message) {
            var logDiv = document.getElementById('logs');
            logDiv.innerHTML += "<div>> " + message + "</div>";
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // --- 1. ENTRAINEMENT ---
        function startTraining() {
            log("Demande d'entraînement envoyée...");
            document.getElementById('train-status').innerText = "Démarrage...";
            
            // Configuration envoyée au Python
            var config = {
                learning_rate: 0.001,
                epochs: 20,
                input_size: 50,
                conv_layers: [{filters: 8, kernel: 3}], // Petit réseau pour le test
                dense_layers: [16]
            };
            socket.emit('start_training', config);
        }

        // Écoute des mises à jour des poids (Simulation Visuelle)
        socket.on('training_step', function(data) {
            document.getElementById('loss-display').innerText = data.loss.toFixed(4);
            document.getElementById('acc-display').innerText = data.accuracy.toFixed(4);
            document.getElementById('train-status').innerText = "Epoch en cours (Batch " + data.batch + ")";
            
            // C'est ici qu'on reçoit les poids pour l'animation
            console.log("Poids reçus pour animation:", data.layers);
            log("Reçu weights update (Batch " + data.batch + ")");
        });

        socket.on('training_complete', function() {
            document.getElementById('train-status').innerText = "Terminé !";
            log("Entraînement terminé.");
            alert("Modèle entraîné ! Tu peux maintenant tester la prédiction.");
        });

        // --- 2. PREDICTION ---
        function predictImage() {
            var input = document.getElementById('imageInput');
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                
                reader.onload = function(e) {
                    var base64Image = e.target.result;
                    log("Envoi de l'image pour prédiction...");
                    
                    socket.emit('predict_sample', {
                        image: base64Image,
                        input_size: 50
                    });
                }
                
                reader.readAsDataURL(input.files[0]); // Convertit l'image en Base64
            } else {
                alert("Sélectionne une image d'abord !");
            }
        }

        // Réception du résultat de prédiction (Simulation Visuelle)
        socket.on('prediction_simulation', function(data) {
            document.getElementById('pred-result').innerText = (data.probability * 100).toFixed(2) + "%";
            
            // C'est ici qu'on reçoit les activations pour allumer les neurones
            console.log("Activations reçues pour animation:", data.network_state);
            log("Reçu simulation prédiction (voir console F12 pour détails)");
            
            // Affiche un résumé des activations dans les logs
            data.network_state.forEach(layer => {
                log("Couche " + layer.layer_name + ": " + layer.activations.length + " activations reçues.");
            });
        });

        socket.on('prediction_result', function(data) {
            if(data.error) log("Erreur: " + data.error);
        });

    </script>
</body>
</html>
